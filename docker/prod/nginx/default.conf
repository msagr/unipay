# Upstream API and Frontend definitions
upstream api {
    server api:3001;  # API service now running on port 3001
}

upstream frontend {
    server frontend:8080;  # Frontend service now running on port 8080
}

server {
    listen 80;
    server_name your-domain.com;  # Replace with your actual domain or IP

    client_max_body_size 20M;  # Set appropriate max body size for uploads

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # HSTS
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;  # Adjust as needed

    # Logging (optional for production)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Handle API routes
    location /api/v1/ {
        proxy_pass http://api;  # Proxies to API running on port 3001
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Handle Frontend Routes (Next.js or other frontend)
    location / {
        proxy_pass http://frontend/;  # Proxies to frontend running on port 8080
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        
        # WebSocket support (for Next.js or similar frameworks)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Handle static assets for Next.js (or similar)
    location ~* \.(?:ico|css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|webp|json)$ {
        root /app;  # Adjust path to where your frontend assets are stored
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;  # Disable access logs for static files
    }

    # Error pages (custom error handling)
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;  # Customize error pages location if needed
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Enable keep-alive for proxy connections
    keepalive_timeout 65;
}
