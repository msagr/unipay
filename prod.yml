services:
    api:
      container_name: api
      restart: always
      build:
        context: .
        dockerfile: docker/prod/backend/Dockerfile
      ports:
        - "3001:3000"
      volumes:
        - ./backend:/app
        - api-logs:/app/logs 
      environment:
        - PORT=3000 
        - NODE_ENV=staging
        - MONGO_URI=${MONGO_URI}
      env_file:
        - .backend.env
      depends_on:
        - mongo
        - mailhog
      networks:
        - unipay
    
    frontend:
      container_name: frontend
      restart: always
      build:
        context: .
        dockerfile: docker/prod/frontend/Dockerfile
      ports:
        - "4001:4000"
      volumes:
        - ./frontend:/app
      environment:
        - PORT=4000
      env_file:
        - .frontend.env
      depends_on:
        - api
      networks:
        - unipay
    
    mongo:
      image: mongo:latest
      container_name: mongo
      restart: always
      ports:
        - "27017:27017"
      volumes:
        - mongo-data:/data/db
      environment:
        - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
        - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      networks:
        - unipay
    
    mailhog:
      image: mailhog/mailhog:latest
      container_name: mailhog
      ports:
        - "1025:1025"
        - "8025:8025"
      networks:
        - unipay
    
    nginx:
      container_name: nginx
      restart: always
      build:
        context: .
        dockerfile: docker/local/nginx/Dockerfile
      ports:
        - "8080:80"
      volumes:
        - ./docker/local/nginx/default.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - api
        - frontend
      networks:
        - unipay

networks:
  unipay:
    driver: bridge

volumes:
  mongo-data:
  api-logs: